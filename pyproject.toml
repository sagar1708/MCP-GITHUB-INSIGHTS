[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-github-insights"
version = "0.1.0"
description = "MCP server exposing GitHub repository insights (activity, contributors, stale PRs, releases) as tools for AI assistants."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sagar Patel" }]
dependencies = [
    "mcp>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
github-insights-mcp = "github_insights.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_insights"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
